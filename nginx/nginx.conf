# Serves the static frontend and proxies API calls to the FastAPI backend.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS (127.0.0.11). Resolve the backend at request time so
    # nginx keeps working if the backend container is recreated with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/(extract|extract/json|health) {
        set $backend http://doc-parser:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is static, served from the frontend directory.
    location / {
        try_files $uri $uri/ /index.html =404;
    }
}
