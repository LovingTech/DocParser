[project]
name = "doc-parser"
version = "0.1.0"
description = "A VLM-backed service that extracts structured data from PDF documents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.40.0",
    "httpx==0.27.0",
    "openai==1.58.1",
    "PyMuPDF==1.28.2",
    "Pillow==10.4.0",
    "pydantic==2.8.2",
    "python-multipart==0.0.20",
    "langchain-core>=1.6.4",
]

[dependency-groups]
dev = ["ruff==0.9.4", "pytest==8.3.4", "httpx==0.27.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
